<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تهنئة رمضان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cairo', sans-serif;
  background-image:url("BackGround.jpg");
  background-size:cover;
  background-position:center;
}

.wrapper{
  background:rgba(0,0,0,0.4);
  padding:20px;
  border-radius:20px;
  text-align:center;
}

canvas{
  max-width:100%;
  border-radius:15px;
}

.controls{
  margin-top:15px;
}

input{
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="wrapper">
  <canvas id="cardCanvas"></canvas>

  <div class="controls">
    <input type="text" id="nameInput" placeholder="اكتب اسمك">
    <button onclick="generateImage()">عرض</button>
    <button onclick="downloadImage()">تحميل الصورة</button>
  </div>
</div>

<script>
const canvas = document.getElementById("cardCanvas");
const ctx = canvas.getContext("2d");
const img = new Image();
img.src = "ramadan.png";

img.onload = function(){
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img,0,0);
}

function generateImage(){
  const name = document.getElementById("nameInput").value;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0);

  ctx.font = "bold 60px Cairo";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";

  // 👇 مكان الاسم فوق الخط (عدل الرقم لو احتجت)
  ctx.fillText(name, canvas.width/2, canvas.height * 0.75);
}

function downloadImage(){
  const link = document.createElement("a");
  link.download = "ramadan-card.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
